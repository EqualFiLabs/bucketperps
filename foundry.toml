[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.33"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "test/fixtures" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "statics-oracle/=lib/statics-oracle/src/",
  "src/interfaces/IAggregatorV3.sol=lib/statics-oracle/src/interfaces/IAggregatorV3.sol",
  "src/interfaces/IVerifierProxy.sol=lib/statics-oracle/src/interfaces/IVerifierProxy.sol",
  "src/libraries/DataStreamsV3.sol=lib/statics-oracle/src/libraries/DataStreamsV3.sol",
  "src/libraries/OracleMath.sol=lib/statics-oracle/src/libraries/OracleMath.sol",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = true

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
